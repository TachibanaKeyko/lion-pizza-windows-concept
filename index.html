<!doctype html>
<html lang="ru"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LION PIZZA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0b0a;color:#f3ece4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:48px 20px 80px}
@media(max-width:600px){.row{gap:12px}body{padding:32px 12px 60px}}
.w{max-width:1200px;margin:0 auto}
h1{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.02em;text-align:center}
h1 span{color:#ff8a1f;font-weight:600}
h2{font-size:15px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#ffb347;margin:64px 0 20px;text-align:center}
img{display:block;width:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.row{display:grid;gap:24px;justify-content:center;align-items:start}
.one{grid-template-columns:minmax(0,560px)}
.two{grid-template-columns:repeat(2,minmax(0,440px))}
.top{grid-template-columns:2.4fr 1fr;max-width:818px;margin:0 auto}
</style></head><body><div class="w">
<h1><span>lion</span>PIZZA</h1>
<h2>Фасад</h2>
<img src="facade.jpg" alt="">
<h2>Окно</h2>
<div class="row one"><img src="window.jpg" alt=""></div>
</div></body></html>
